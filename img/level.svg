<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 14 14">
  <style>
    .bar {
      fill: #1DB954;
      transform-origin: bottom;
      transform-box: fill-box;
      animation-iteration-count: infinite;
      animation-timing-function: ease-in-out;
    }

    /* Precise multi-keyframe animations matching the video rhythm */
    .bar-1 { animation: eq-1 1.2s infinite; }
    .bar-2 { animation: eq-2 1.1s infinite; }
    .bar-3 { animation: eq-3 1.3s infinite; }
    .bar-4 { animation: eq-4 1.0s infinite; }

    @keyframes eq-1 {
      0%, 100% { transform: scaleY(0.7); }
      20% { transform: scaleY(0.25); }
      40% { transform: scaleY(1.0); }
      60% { transform: scaleY(0.4); }
      80% { transform: scaleY(0.9); }
    }

    @keyframes eq-2 {
      0%, 100% { transform: scaleY(0.2); }
      25% { transform: scaleY(0.55); }
      50% { transform: scaleY(0.2); }
      75% { transform: scaleY(0.45); }
    }

    @keyframes eq-3 {
      0%, 100% { transform: scaleY(0.35); }
      30% { transform: scaleY(0.85); }
      60% { transform: scaleY(0.2); }
      85% { transform: scaleY(0.65); }
    }

    @keyframes eq-4 {
      0%, 100% { transform: scaleY(0.9); }
      25% { transform: scaleY(0.3); }
      50% { transform: scaleY(1.0); }
      75% { transform: scaleY(0.5); }
    }
  </style>

  <!-- 4 distinct vertical bars -->
  <rect class="bar bar-1" x="0" y="0" width="2" height="14" />
  <rect class="bar bar-2" x="4" y="0" width="2" height="14" />
  <rect class="bar bar-3" x="8" y="0" width="2" height="14" />
  <rect class="bar bar-4" x="12" y="0" width="2" height="14" />
</svg>
